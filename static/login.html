<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · TradeBot</title>
<script src="/static/theme.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<main class="login">
  <form class="login-card" id="login-form" autocomplete="on">
    <span class="sh-logo" style="margin:0"><i></i></span>
    <h1>TradeBot</h1>
    <p>Sign in to continue.</p>
    <input id="pw" type="password" placeholder="Password" autocomplete="current-password" required autofocus aria-label="Password">
    <button class="btn g" type="submit">Sign in</button>
    <div class="login-err" id="err"></div>
  </form>
</main>
<script src="/static/login.js"></script>
</body>
</html>
